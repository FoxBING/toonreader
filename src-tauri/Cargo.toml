[package]
name = "toonreader"
version = "0.1.0"
description = "Webtoon strip reader with background waifu2x upscaling"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
imagesize = "0.15"

[profile.dev]
opt-level = 1
